name: ci

on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - run: go build ./...
            - run: make test

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - run: make lint
