name: ci

on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        # Servers for internal/db and the Databases view, which reach them
        # through the runner's psql and mysql.
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: pw
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
            mariadb:
                image: mariadb:11
                env:
                    MARIADB_ROOT_PASSWORD: pw
                    MARIADB_DATABASE: test
                ports: ["3306:3306"]
                options: >-
                    --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 5s --health-retries 30
        env:
            PANDO_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/postgres?sslmode=disable
            PANDO_TEST_MARIADB: mariadb://root:pw@127.0.0.1:3306/test
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - run: go build ./...
            - run: make test

    # macOS's temp dir sits behind the /var -> /private/var symlink, which git
    # resolves and pando does not, and its socket paths run past 104 bytes.
    macos:
        runs-on: macos-latest
        env:
            TMPDIR: /private/tmp
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - run: make test

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - run: make lint

    # Only the tests written for Windows: the rest drive sh, a pty and /proc.
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true
            - run: go vet ./...
            - run: go test -race -run "Windows|LockFile" . ./internal/daemon ./internal/git
